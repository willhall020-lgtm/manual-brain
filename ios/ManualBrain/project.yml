# XcodeGen spec — generates ManualBrain.xcodeproj from these plain-text
# sources. This repo ships the spec, not a binary .xcodeproj, so the project
# stays diffable and reviewable in a PR the way the rest of this repo is.
# See ios/ManualBrain/README.md for the one-line setup.
name: ManualBrain
options:
  bundleIdPrefix: xyz.manualbrain
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_PREVIEWS: "YES"
    DEVELOPMENT_TEAM: "" # fill in your own Apple Developer Team ID before archiving

targets:
  ManualBrain:
    type: application
    platform: iOS
    sources:
      - path: ManualBrain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.manualbrain.ios
        TARGETED_DEVICE_FAMILY: "1" # iPhone only — this is a phone-only design
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: "NO"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: ManualBrain/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleDisplayName: manual brain
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    entitlements:
      path: ManualBrain/ManualBrain.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default

schemes:
  ManualBrain:
    build:
      targets:
        ManualBrain: all
    run:
      config: Debug
    archive:
      config: Release
