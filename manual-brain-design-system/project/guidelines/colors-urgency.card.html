<!-- @dsCard group="Colors" viewport="700x150" name="Urgency scale" subtitle="The five fixed relative labels — no other due-date colours exist" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg-page);font-family:var(--font-body);color:var(--text-body)}.row{display:flex;gap:7px;padding:22px 16px;align-items:center;flex-wrap:wrap}.p{border-radius:var(--radius-pill);padding:6px 12px;font-size:12px;font-weight:700}.cap{padding:0 16px;font-size:11.5px;font-weight:600;color:var(--text-muted)}</style></head><body><div class="row">
<span class="p" style="background:var(--urg-today-bg);color:var(--urg-today-fg);border:1px solid var(--urg-today-bd)">today</span>
<span class="p" style="background:var(--urg-2-3-bg);color:var(--urg-2-3-fg);border:1px solid var(--urg-2-3-bd)">2–3 days</span>
<span class="p" style="background:var(--urg-week-bg);color:var(--urg-week-fg);border:1px solid var(--urg-week-bd)">end of this week</span>
<span class="p" style="background:var(--urg-month-bg);color:var(--urg-month-fg);border:1px solid var(--urg-month-bd)">this month</span>
<span class="p" style="background:var(--urg-custom-bg);color:var(--urg-custom-fg);border:1px dashed var(--urg-custom-bd)">custom</span>
</div>
<div class="cap">Order is fixed: soonest first, custom last. Nothing else may be added.</div></body></html>
