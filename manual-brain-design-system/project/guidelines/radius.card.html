<div class="c" style="border-radius:var(--radius-card)">20</div>
<div class="c" style="border-radius:var(--radius-box)">16</div>
<div class="c" style="border-radius:var(--radius-row)">14</div>
<div class="c" style="border-radius:var(--radius-menu)">13</div>
