<!-- @dsCard group="Spacing" viewport="700x180" name="Borders & shadow" subtitle="Flat + 1px border at rest; two warm shadows mean floating" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg-page);font-family:var(--font-body);color:var(--text-body)}.row{display:flex;gap:14px;padding:20px 16px;align-items:stretch}.c{flex:1;background:var(--surface-card);border-radius:var(--radius-box);padding:14px;font-size:11px;font-weight:700;color:var(--text-muted);display:flex;align-items:flex-end;min-height:92px}</style></head><body><div class="row">
<div class="c" style="border:1px solid var(--border-card)">Rest · 1px #E6E6E0, no shadow</div>
<div class="c" style="border:1.5px dashed var(--border-dashed)">Ghost · 1.5px dashed</div>
<div class="c" style="border:1.5px solid var(--border-strong);box-shadow:var(--shadow-popover)">Active box · ink border + popover shadow</div>
<div class="c" style="border:1px solid #E4E4DE;box-shadow:var(--shadow-menu)">Menu · 0 14px 34px rgba(20,20,15,.14)</div>
</div></body></html>
