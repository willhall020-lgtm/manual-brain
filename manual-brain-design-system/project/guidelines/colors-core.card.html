<!-- @dsCard group="Colors" viewport="700x150" name="Core three" subtitle="Paper, ink, lime — the whole identity" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg-page);font-family:var(--font-body);color:var(--text-body)}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:var(--radius-row)}.n{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}.h{font-size:11px;font-weight:600;color:var(--text-muted);font-variant-numeric:tabular-nums}.row{display:flex;gap:10px;padding:16px}.row>*{flex:1}</style></head><body><div class="row">
<div class="sw"><div class="chip" style="background:var(--mb-paper);border:1px solid var(--border-card)"></div><span class="n">Paper</span><span class="h">#F6F6F3</span></div>
<div class="sw"><div class="chip" style="background:var(--mb-ink)"></div><span class="n">Ink</span><span class="h">#14140F</span></div>
<div class="sw"><div class="chip" style="background:var(--mb-lime)"></div><span class="n">Lime</span><span class="h">#D6EC3C</span></div>
<div class="sw"><div class="chip" style="background:var(--mb-white);border:1px solid var(--border-card)"></div><span class="n">White</span><span class="h">#FFFFFF</span></div>
</div></body></html>
