<!-- @dsCard group="Brand" viewport="700x180" name="Interaction states" subtitle="Borders darken to ink, opacity drops, cards lift 2px — no colour shifts" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg-page);font-family:var(--font-body);color:var(--text-body)}.b{padding:16px;display:flex;flex-direction:column;gap:10px}.r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.l{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--text-faint);width:92px;flex:none}
.ck{width:21px;height:21px;border-radius:99px;border:1.5px solid var(--border-check);background:#fff}.ckh{width:21px;height:21px;border-radius:99px;border:1.5px solid var(--mb-blue);background:var(--mb-blue-tint)}
.card{background:#fff;border:1px solid var(--border-card);border-radius:var(--radius-card);padding:10px 14px;font-size:12.5px;font-weight:700}.cardh{background:#fff;border:1px solid var(--mb-ink);border-radius:var(--radius-card);padding:10px 14px;font-size:12.5px;font-weight:700;transform:translateY(-2px)}
.ib{width:25px;height:25px;border-radius:var(--radius-icon);display:flex;align-items:center;justify-content:center;color:var(--icon-rest)}.ibh{width:25px;height:25px;border-radius:var(--radius-icon);display:flex;align-items:center;justify-content:center;background:var(--mb-n-200);color:var(--mb-ink)}.ibd{width:25px;height:25px;border-radius:var(--radius-icon);display:flex;align-items:center;justify-content:center;background:var(--mb-n-200);color:var(--mb-red)}
.p{background:var(--urg-week-bg);color:var(--urg-week-fg);border:1px solid var(--urg-week-bd);border-radius:99px;padding:4px 10px;font-size:11px;font-weight:700}</style></head><body><div class="b">
<div class="r"><span class="l">check</span><span class="ck"></span><span class="ckh"></span><span style="font-size:11px;font-weight:600;color:var(--text-muted)">rest → hover fills blue tint</span></div>
<div class="r"><span class="l">card</span><span class="card">life admin</span><span class="cardh">life admin</span><span style="font-size:11px;font-weight:600;color:var(--text-muted)">border → ink, lift 2px</span></div>
<div class="r"><span class="l">icon</span><span class="ib">✎</span><span class="ibh">✎</span><span class="ibd">✕</span><span style="font-size:11px;font-weight:600;color:var(--text-muted)">grey square fills, glyph darkens</span></div>
<div class="r"><span class="l">pill</span><span class="p">end of this week</span><span class="p" style="opacity:.82">end of this week</span><span style="font-size:11px;font-weight:600;color:var(--text-muted)">opacity .82</span></div>
</div></body></html>
