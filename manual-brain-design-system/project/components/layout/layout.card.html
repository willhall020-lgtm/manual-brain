<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:14px;background:var(--bg-page)}.col{display:flex;flex-direction:column;gap:14px}.split{display:flex;gap:14px;align-items:flex-start}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:var(--gap-card-grid)}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { PageHeader, Eyebrow, TodayBlock, TodayTaskRow, ListCard, AddListCard, DonePanel, CalendarPanel, ErrorBanner, BackButton } = window.ManualBrainDesignSystem_41bc1a;
const DONE=[{id:'1',name:'Book dentist',sectionName:'Life admin'},{id:'2',name:'Send invoice',sectionName:'Work (Deloitte)'}];
function Demo(){
  const [open,setOpen]=React.useState(true);
  return (<div className="col">
    <PageHeader dateLabel="TUESDAY 1 SEPTEMBER" meta="33 tasks in total · 8 done" />
    <ErrorBanner message="Couldn't save that task — try again." />
    <div className="split">
      <div className="col" style={{flex:1,minWidth:0}}>
        <TodayBlock count={2} note={null}>
          <TodayTaskRow name="Apply to baby vc bootcamp" sectionName="Applications" />
        </TodayBlock>
        <Eyebrow>THE REST — OPEN WHEN YOU'RE READY</Eyebrow>
        <div className="cards">
          <ListCard name="Work (Deloitte)" taskCount={6} todayCount={1} />
          <ListCard name="Life admin" taskCount={5} soonCount={2} />
          <AddListCard />
        </div>
        <BackButton />
        <DonePanel items={DONE} open={open} onToggle={()=>setOpen(v=>!v)} />
      </div>
      <CalendarPanel todayLabel="TODAY · TUE 1" tomorrowLabel="TOMORROW · WED 2"
        before={[{time:'09:30',title:'Daily standup',meta:'15 min · Meet',barColor:'#2B34EE'}]}
        after={[{time:'15:00',title:'1:1 with Marcus',meta:'30 min',barColor:'#C6C9FA'}]}
        tomorrow={[{time:'09:00',title:'Workshop prep',meta:'2 hrs',barColor:'#EAEAE4',dim:true}]} />
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
